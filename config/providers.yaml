paid_providers:
  deepseek:
    name: DeepSeek
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    openai_compatible: true
    billing:
      model: pay-per-token
    models:
    - deepseek-flash
    - deepseek-v4-pro
  grok:
    name: Grok (xAI)
    api_base: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    openai_compatible: true
    billing:
      model: pay-per-token
    models:
    - grok-4.7
    - grok-4.1-fast
  openai:
    name: OpenAI
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    openai_compatible: true
    billing:
      model: pay-per-token
    models:
    - gpt-4o
    - gpt-4o-mini
  anthropic:
    name: Anthropic
    api_base: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    openai_compatible: false
    adapter: litellm
    billing:
      model: pay-per-token
    models:
    - claude-opus-4-6
    - claude-sonnet-4-6
routing:
  default_mode: single
  strategy: quota_aware
  fallback_on_429: true
  paid_routing:
    mode: free_first
    confirm_before_paid: true
    show_cost_estimate: true
ensemble:
  enabled: false
  panel_size: 3
  judge: llama3.2:3b
  min_provider_families: 2
  warn_before_execution: true
local:
  enabled: true
  provider: ollama
  api_base: http://localhost:11434
  models:
    judge: llama3.2:3b
    fallback: qwen3:8b
