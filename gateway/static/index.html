<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bro — Assistente AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤙</text></svg>">
  <link rel="stylesheet" href="/ui/vendor/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="/ui/style.css">
  <script src="/ui/vendor/marked.min.js"></script>
  <script src="/ui/vendor/katex.min.js"></script>
  <script src="/ui/vendor/auto-render.min.js"></script>
  <script src="/ui/vendor/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <div id="onboarding" class="onboarding" style="display: none;">
    <div class="onb-card">
      <div class="onb-logo">🤙</div>
      <h1 class="onb-title">BENVENUTO</h1>
      <p class="onb-sub">Configura il tuo assistente in 10 secondi.</p>
      <form id="onboarding-form">
        <label class="onb-label">Come ti chiami?</label>
        <input type="text" id="onb-name" class="onb-input" placeholder="Il tuo nome" autocomplete="off" required>
        <label class="onb-label">Che lavoro fai?</label>
        <div id="prof-grid" class="prof-grid"></div>
        <button type="submit" class="onb-start">INIZIA →</button>
      </form>
    </div>
  </div>

  <canvas id="matrix-rain"></canvas>
  <div class="scanlines"></div>

  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">⬢</span>
        <span class="logo-text">BRO</span>
      </div>
      <button class="icon-btn" id="toggle-sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <button class="new-chat-btn" id="new-chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Nuova sessione</span>
    </button>
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search-conv" class="search-input" placeholder="Cerca...">
    </div>
    <div class="conversations" id="conversations"></div>
    <div class="credits-panel">
      <div class="credits-header"><div class="credits-title"><span class="pulse-dot"></span><span>NODI</span></div></div>
      <div class="credits-list" id="credits-list"></div>
    </div>
    <div class="sidebar-footer">
      <div class="status-pill" id="status-pill"><span class="status-dot"></span><span id="status-text">Connessione...</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">BRO // v1.0</div>
      <div class="topbar-right">
        <button class="skin-btn" id="skin-btn">
          <span id="skin-name">AI</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </header>

    <div class="scene">
      <div class="face-wrap">
        <canvas id="face-canvas"></canvas>
        <div class="face-name" id="face-name">AI</div>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <form class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="Scrivi..." rows="1"></textarea>
        <button type="submit" class="send-btn" id="send" title="Invia">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="composer-hint"><span id="hint-text">Scrivi o di' "cambia forma in drago"</span></div>
    </form>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="/ui/profile.js"></script>
  <script src="/ui/onboarding.js"></script>
  <script src="/ui/matrix-rain.js"></script>
  <script src="/ui/jarvis.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
